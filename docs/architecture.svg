<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>OCR in the Cloud: architecture</title>
  <desc>The Local App on the user's computer talks to AWS only through SQS queues and an S3 bucket. A Manager on EC2
    reads jobs, sends one task per image, and launches Workers. Workers download images from the internet, run OCR,
    and send back results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59616e"/>
    </marker>
    <style>
      .region { fill: #f3f6fb; stroke: #cdd4df; stroke-width: 1.2; }
      .outer { fill: #fbfcfe; stroke: #c3cad6; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.6; }
      .ghost { fill: #ffffff; stroke: #a3abb8; stroke-width: 1.2; }
      .regionLabel { font-size: 13px; fill: #4a5160; }
      .outerLabel { font-size: 17px; fill: #2b2b2b; }
      .title { font-size: 16px; font-weight: 700; fill: #222; }
      .sub { font-size: 12.5px; fill: #555; }
      .chipText { font-size: 13px; font-weight: 700; }
      .chipSub { font-size: 11px; }
      .link { stroke: #59616e; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
      .linkLabel { font-size: 12.5px; fill: #2f6fdb; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Your computer -->
  <rect class="region" x="20" y="20" width="210" height="600" rx="14"/>
  <text class="regionLabel" x="215" y="46" text-anchor="end">Your computer</text>
  <rect class="box" x="38" y="90" width="174" height="490" rx="10"/>
  <text class="title" x="125" y="126" text-anchor="middle">Local App</text>
  <text class="sub" x="125" y="152" text-anchor="middle">uploads the input</text>
  <text class="sub" x="125" y="170" text-anchor="middle">waits for the answer</text>
  <text class="sub" x="125" y="188" text-anchor="middle">writes the HTML</text>
  <rect x="55" y="430" width="140" height="48" rx="9" fill="#fde6ea" stroke="#de7686" stroke-width="1.3"/>
  <text class="chipText" x="125" y="459" text-anchor="middle" fill="#8f2c3c">output.html</text>

  <!-- AWS -->
  <rect class="outer" x="260" y="20" width="700" height="600" rx="18"/>
  <text class="outerLabel" x="945" y="50" text-anchor="end">AWS · us-east-1</text>

  <!-- SQS -->
  <rect class="region" x="290" y="70" width="640" height="120" rx="12"/>
  <text class="regionLabel" x="915" y="92" text-anchor="end">SQS queues</text>
  <g fill="#e4eefc" stroke="#6d97d9" stroke-width="1.3">
    <rect x="310" y="118" width="140" height="50" rx="9"/>
    <rect x="465" y="118" width="140" height="50" rx="9"/>
    <rect x="620" y="118" width="140" height="50" rx="9"/>
    <rect x="775" y="118" width="140" height="50" rx="9"/>
  </g>
  <g fill="#234b8a" text-anchor="middle">
    <text class="chipText" x="380" y="140">inbox</text>
    <text class="chipSub" x="380" y="157">shared by all</text>
    <text class="chipText" x="535" y="140">reply</text>
    <text class="chipSub" x="535" y="157">one per client</text>
    <text class="chipText" x="690" y="140">tasks</text>
    <text class="chipSub" x="690" y="157">one per Manager</text>
    <text class="chipText" x="845" y="140">results</text>
    <text class="chipSub" x="845" y="157">one per Manager</text>
  </g>

  <!-- Manager -->
  <rect class="region" x="290" y="250" width="300" height="210" rx="12"/>
  <text class="regionLabel" x="575" y="272" text-anchor="end">EC2 · Manager</text>
  <rect class="box" x="315" y="290" width="250" height="150" rx="10"/>
  <text class="title" x="440" y="318" text-anchor="middle">Manager</text>
  <text class="sub" x="440" y="340" text-anchor="middle">splits jobs · collects results</text>
  <rect x="345" y="365" width="190" height="50" rx="9" fill="#dcf3ef" stroke="#4cae9f" stroke-width="1.3"/>
  <text class="chipText" x="440" y="395" text-anchor="middle" fill="#1f6e63">Job table</text>

  <!-- Workers (several instances) -->
  <rect class="region" x="630" y="250" width="300" height="210" rx="12"/>
  <text class="regionLabel" x="915" y="272" text-anchor="end">EC2 · Workers (up to 18)</text>
  <rect class="ghost" x="671" y="306" width="250" height="150" rx="10"/>
  <rect class="ghost" x="663" y="298" width="250" height="150" rx="10"/>
  <rect class="box" x="655" y="290" width="250" height="150" rx="10"/>
  <text class="title" x="780" y="318" text-anchor="middle">Worker</text>
  <text class="sub" x="780" y="340" text-anchor="middle">download → OCR → result</text>
  <rect x="685" y="365" width="190" height="50" rx="9" fill="#ece7fb" stroke="#957fd6" stroke-width="1.3"/>
  <text class="chipText" x="780" y="395" text-anchor="middle" fill="#4b3891">Tesseract OCR</text>

  <!-- S3 -->
  <rect class="region" x="290" y="500" width="640" height="100" rx="12"/>
  <text class="regionLabel" x="915" y="522" text-anchor="end">S3 bucket</text>
  <g fill="#fdf0dc" stroke="#e0a24a" stroke-width="1.3">
    <rect x="330" y="536" width="170" height="46" rx="9"/>
    <rect x="515" y="536" width="170" height="46" rx="9"/>
    <rect x="700" y="536" width="170" height="46" rx="9"/>
  </g>
  <g fill="#85540f" text-anchor="middle" class="chipText">
    <text x="415" y="564">input files</text>
    <text x="600" y="564">summaries</text>
    <text x="785" y="564">app jar</text>
  </g>

  <!-- The internet -->
  <rect class="region" x="990" y="250" width="190" height="210" rx="14"/>
  <text class="regionLabel" x="1165" y="272" text-anchor="end">The internet</text>
  <rect class="box" x="1005" y="300" width="160" height="110" rx="10"/>
  <text class="title" x="1085" y="347" text-anchor="middle">Image hosts</text>
  <text class="sub" x="1085" y="369" text-anchor="middle">images by URL</text>

  <!-- Links -->
  <line class="link" x1="214" y1="135" x2="286" y2="135" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="linkLabel" x="250" y="125" text-anchor="middle">messages</text>

  <line class="link" x1="214" y1="355" x2="286" y2="355" marker-end="url(#arrow)"/>
  <text class="linkLabel" x="250" y="345" text-anchor="middle">starts</text>

  <line class="link" x1="214" y1="555" x2="286" y2="555" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="linkLabel" x="250" y="545" text-anchor="middle">files</text>

  <line class="link" x1="420" y1="194" x2="420" y2="286" marker-end="url(#arrow)"/>
  <line class="link" x1="460" y1="286" x2="460" y2="194" marker-end="url(#arrow)"/>

  <line class="link" x1="700" y1="194" x2="700" y2="286" marker-end="url(#arrow)"/>
  <line class="link" x1="740" y1="286" x2="740" y2="194" marker-end="url(#arrow)"/>

  <line class="link" x1="440" y1="444" x2="440" y2="496" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <line class="link" x1="567" y1="400" x2="651" y2="400" marker-end="url(#arrow)"/>
  <text class="linkLabel" x="610" y="390" text-anchor="middle">launches</text>

  <line class="link" x1="909" y1="355" x2="1001" y2="355" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="linkLabel" x="955" y="345" text-anchor="middle">download</text>
</svg>
